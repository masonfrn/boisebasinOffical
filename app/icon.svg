<!-- The real Boise Basin mark, traced from the logo file, so the icon Google
     shows beside a search result is the same badge as the Facebook and Google
     Business profiles. Only the circular mountain/truck badge is used: the
     "BOISE BASIN JUNK REMOVAL" wordmark from the full lockup is illegible at
     the 16px Google actually renders, and a smudge of unreadable text reads
     worse than no text at all.
     Basin orange (#F2662D, the CTA color) rather than navy: it's the color
     that carries the brand at a glance, and an orange chip is far easier to
     pick out of a page of search results than another dark-blue one. The mark
     is knocked out in white because the outline strokes are thin and survive
     shrinking much better as light-on-dark. -->
